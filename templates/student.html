<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ffd9c7;
            color: #333;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }

        h1 {
            text-align: center;
            color: #6d3427;
            margin-bottom: 25px;
        }

        .form-box,
        .table-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        h2 {
            color: #7a3e2f;
            margin-top: 0;
        }

        /* FORM */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            height: 70px;
            resize: none;
        }

        .full {
            grid-column: span 2;
        }

        .add-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #7a3e2f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .add-btn:hover {
            background-color: #5d2e24;
        }

        /* SEARCH */

        .search-area {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .search-area input {
            width: 250px;
            padding: 9px;
        }

        .search-btn,
        .clear-btn {
            padding: 9px 15px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .search-btn {
            background-color: #7a3e2f;
        }

        .clear-btn {
            background-color: #888;
        }

        /* TABLE */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #f4b39a;
            color: #5a2d22;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 11px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #fff5ef;
        }

        /* DELETE ICON */

        .delete-icon {
            width: 32px;
            height: 32px;

            border: none;
            border-radius: 5px;

            background-color: #e74c3c;
            color: white;

            font-size: 16px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-icon:hover {
            background-color: #c0392b;
        }

        .action-cell {
            text-align: right;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: span 1;
            }

            .search-area {
                flex-wrap: wrap;
            }

            .search-area input {
                width: 200px;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <h1>Student Management</h1>


    <!-- ADD STUDENT -->

    <div class="form-box">

        <h2>Add Student</h2>

        <form id="studentForm">

            <div class="form-grid">

                <input
                    type="text"
                    id="name"
                    placeholder="Student Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="text"
                    id="phone"
                    placeholder="Phone Number"
                    required
                >

                <input
                    type="date"
                    id="date_of_birth"
                    required
                >

                <select id="gender" required>

                    <option value="">Select Gender</option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

                <textarea
                    id="address"
                    placeholder="Address"
                    class="full"
                ></textarea>

            </div>

            <button
                type="submit"
                class="add-btn"
            >
                Add Student
            </button>

        </form>

    </div>


    <!-- STUDENT LIST -->

    <div class="table-box">

        <h2>Student List</h2>


        <!-- SEARCH ABOVE TABLE -->

        <div class="search-area">

            <input
                type="text"
                id="searchName"
                placeholder="Search student name"
            >

            <button
                type="button"
                class="search-btn"
                onclick="searchStudents()"
            >
                Search
            </button>

            <button
                type="button"
                class="clear-btn"
                onclick="loadStudents()"
            >
                Clear
            </button>

        </div>


        <!-- TABLE -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Phone</th>

                        <th>DOB</th>

                        <th>Gender</th>

                        <th>Address</th>

                        <th style="text-align:right;">
                            Action
                        </th>

                    </tr>

                </thead>

                <tbody id="studentTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>


/* =========================
   DISPLAY STUDENTS
========================= */

function displayStudents(data) {

    const table =
        document.getElementById("studentTable");

    table.innerHTML = "";


    if (data.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="8" style="text-align:center;">
                    No students found
                </td>
            </tr>
        `;

        return;
    }


    data.forEach(student => {

        table.innerHTML += `

            <tr>

                <td>
                    ${student.id}
                </td>

                <td>
                    ${student.name}
                </td>

                <td>
                    ${student.email}
                </td>

                <td>
                    ${student.phone}
                </td>

                <td>
                    ${student.date_of_birth}
                </td>

                <td>
                    ${student.gender}
                </td>

                <td>
                    ${student.address || ""}
                </td>

                <td class="action-cell">

                    <button
                        class="delete-icon"
                        title="Delete Student"
                        onclick="deleteStudent(${student.id})"
                    >
                        🗑
                    </button>

                </td>

            </tr>

        `;

    });

}


/* =========================
   LOAD ALL STUDENTS
========================= */

function loadStudents() {

    document.getElementById("searchName").value = "";


    fetch("/students/all")

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load students"
                );

            }

            return response.json();

        })

        .then(data => {

            displayStudents(data);

        })

        .catch(error => {

            console.error(error);

            alert(
                "Unable to load students"
            );

        });

}


/* =========================
   ADD STUDENT
========================= */

document
    .getElementById("studentForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const student = {

            name:
                document.getElementById("name").value,

            email:
                document.getElementById("email").value,

            phone:
                document.getElementById("phone").value,

            date_of_birth:
                document.getElementById("date_of_birth").value,

            gender:
                document.getElementById("gender").value,

            address:
                document.getElementById("address").value

        };


        fetch("/students", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(student)

        })

        .then(response => response.json())

        .then(data => {

            if (data.error) {

                alert(data.error);

            }

            else {

                alert(data.message);

                document
                    .getElementById("studentForm")
                    .reset();

                loadStudents();

            }

        })

        .catch(error => {

            console.error(error);

            alert(
                "Unable to add student"
            );

        });

    });


/* =========================
   SEARCH STUDENT
========================= */

function searchStudents() {

    const name =
        document
            .getElementById("searchName")
            .value
            .trim();


    if (!name) {

        loadStudents();

        return;

    }


    fetch(
        "/students/search?name="
        + encodeURIComponent(name)
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Search failed"
            );

        }

        return response.json();

    })

    .then(data => {

        displayStudents(data);

    })

    .catch(error => {

        console.error(error);

        alert(
            "Unable to search students"
        );

    });

}


/* =========================
   DELETE STUDENT
========================= */

function deleteStudent(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this student?"
        );


    if (!confirmDelete) {

        return;

    }


    fetch(
        "/students/" + id,
        {
            method: "DELETE"
        }
    )

    .then(response => response.json())

    .then(data => {

        if (data.error) {

            alert(data.error);

        }

        else {

            alert(data.message);

            loadStudents();

        }

    })

    .catch(error => {

        console.error(error);

        alert(
            "Unable to delete student"
        );

    });

}


/* =========================
   PAGE LOAD
========================= */

loadStudents();


</script>

</body>

</html>
