<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Management</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ffd9c7;
            color: #333;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }

        h1 {
            text-align: center;
            color: #6d3427;
            margin-bottom: 25px;
        }

        .form-box,
        .table-box {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        h2 {
            color: #7a3e2f;
            margin-top: 0;
        }

        /* FORM */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            height: 80px;
            resize: none;
        }

        .full {
            grid-column: span 2;
        }

        .add-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #7a3e2f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .add-btn:hover {
            background-color: #5d2e24;
        }

        /* SEARCH */

        .search-area {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .search-area input {
            width: 250px;
            padding: 9px;
        }

        .search-btn,
        .clear-btn {
            padding: 9px 15px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .search-btn {
            background-color: #7a3e2f;
        }

        .clear-btn {
            background-color: #888;
        }

        /* TABLE */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #f4b39a;
            color: #5a2d22;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 11px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #fff5ef;
        }

        /* ACTION */

        .action-cell {
            text-align: right;
            white-space: nowrap;
        }

        .edit-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 5px;
            background-color: #f0ad4e;
            color: white;
            cursor: pointer;
            margin-right: 5px;
        }

        .delete-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 5px;
            background-color: #e74c3c;
            color: white;
            cursor: pointer;
        }

        .edit-btn:hover {
            background-color: #ec971f;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }

        /* UPDATE */

        #updateBox {
            display: none;
        }

        .update-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .cancel-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #888;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: span 1;
            }

            .search-area {
                flex-wrap: wrap;
            }

            .search-area input {
                width: 200px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Course Management</h1>

    <!-- ADD COURSE -->

    <div class="form-box">

        <h2>Add Course</h2>

        <form id="courseForm">

            <div class="form-grid">

                <input
                    type="text"
                    id="course_name"
                    placeholder="Course Name"
                    required
                >

                <input
                    type="text"
                    id="course_code"
                    placeholder="Course Code"
                    required
                >

                <input
                    type="text"
                    id="duration"
                    placeholder="Duration"
                    required
                >

                <input
                    type="number"
                    id="fee"
                    placeholder="Course Fee"
                    min="0"
                    step="0.01"
                    required
                >

                <textarea
                    id="description"
                    placeholder="Course Description"
                    class="full"
                ></textarea>

            </div>

            <button
                type="submit"
                class="add-btn"
            >
                Add Course
            </button>

        </form>

    </div>


    <!-- UPDATE COURSE -->

    <div
        class="form-box"
        id="updateBox"
    >

        <h2>Update Course</h2>

        <input
            type="hidden"
            id="update_id"
        >

        <div class="form-grid">

            <input
                type="text"
                id="update_course_name"
                placeholder="Course Name"
            >

            <input
                type="text"
                id="update_course_code"
                placeholder="Course Code"
            >

            <input
                type="text"
                id="update_duration"
                placeholder="Duration"
            >

            <input
                type="number"
                id="update_fee"
                placeholder="Course Fee"
                min="0"
                step="0.01"
            >

            <textarea
                id="update_description"
                placeholder="Course Description"
                class="full"
            ></textarea>

        </div>

        <button
            class="update-btn"
            onclick="updateCourse()"
        >
            Update Course
        </button>

        <button
            class="cancel-btn"
            onclick="cancelUpdate()"
        >
            Cancel
        </button>

    </div>


    <!-- COURSE LIST -->

    <div class="table-box">

        <h2>Course List</h2>

        <!-- SEARCH -->

        <div class="search-area">

            <input
                type="text"
                id="searchCourse"
                placeholder="Search course"
            >

            <button
                type="button"
                class="search-btn"
                onclick="searchCourses()"
            >
                Search
            </button>

            <button
                type="button"
                class="clear-btn"
                onclick="loadCourses()"
            >
                Clear
            </button>

        </div>


        <!-- TABLE -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Course Name</th>
                        <th>Code</th>
                        <th>Duration</th>
                        <th>Fee</th>
                        <th>Description</th>
                        <th style="text-align:right;">
                            Action
                        </th>
                    </tr>

                </thead>

                <tbody id="courseTable"></tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* DISPLAY COURSES */

function displayCourses(data) {

    const table =
        document.getElementById("courseTable");

    table.innerHTML = "";

    if (data.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="7" style="text-align:center;">
                    No courses found
                </td>
            </tr>
        `;

        return;
    }

    data.forEach(course => {

        table.innerHTML += `
            <tr>

                <td>${course.id}</td>

                <td>${course.course_name}</td>

                <td>${course.course_code}</td>

                <td>${course.duration}</td>

                <td>₹${course.fee}</td>

                <td>${course.description || ""}</td>

                <td class="action-cell">

                    <button
                        class="edit-btn"
                        onclick="getCourse(${course.id})"
                        title="Edit"
                    >
                        ✏
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteCourse(${course.id})"
                        title="Delete"
                    >
                        🗑
                    </button>

                </td>

            </tr>
        `;

    });
}


/* LOAD ALL COURSES */

function loadCourses() {

    document.getElementById("searchCourse").value = "";

    fetch("/courses/all")

        .then(response => response.json())

        .then(data => {

            if (data.error) {
                alert(data.error);
                return;
            }

            displayCourses(data);

        })

        .catch(error => {

            console.error(error);

            alert("Unable to load courses");

        });
}


/* ADD COURSE */

document
    .getElementById("courseForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const course = {

            course_name:
                document.getElementById("course_name").value,

            course_code:
                document.getElementById("course_code").value,

            duration:
                document.getElementById("duration").value,

            fee:
                document.getElementById("fee").value,

            description:
                document.getElementById("description").value
        };

        fetch("/courses", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(course)

        })

        .then(response => response.json())

        .then(data => {

            if (data.error) {

                alert(data.error);

            } else {

                alert(data.message);

                document
                    .getElementById("courseForm")
                    .reset();

                loadCourses();
            }

        })

        .catch(error => {

            console.error(error);

            alert("Unable to add course");

        });

    });


/* SEARCH */

function searchCourses() {

    const name =
        document
            .getElementById("searchCourse")
            .value
            .trim();

    if (!name) {

        loadCourses();
        return;

    }

    fetch(
        "/courses/search?name="
        + encodeURIComponent(name)
    )

    .then(response => response.json())

    .then(data => {

        if (data.error) {

            alert(data.error);
            return;

        }

        displayCourses(data);

    })

    .catch(error => {

        console.error(error);

        alert("Unable to search courses");

    });
}


/* GET COURSE */

function getCourse(id) {

    fetch("/courses/" + id)

        .then(response => response.json())

        .then(data => {

            if (data.error) {

                alert(data.error);
                return;

            }

            document.getElementById(
                "update_id"
            ).value = data.id;

            document.getElementById(
                "update_course_name"
            ).value = data.course_name;

            document.getElementById(
                "update_course_code"
            ).value = data.course_code;

            document.getElementById(
                "update_duration"
            ).value = data.duration;

            document.getElementById(
                "update_fee"
            ).value = data.fee;

            document.getElementById(
                "update_description"
            ).value = data.description || "";

            document.getElementById(
                "updateBox"
            ).style.display = "block";

        })

        .catch(error => {

            console.error(error);

            alert("Unable to get course");

        });
}


/* UPDATE COURSE */

function updateCourse() {

    const id =
        document.getElementById("update_id").value;

    const course = {

        course_name:
            document.getElementById(
                "update_course_name"
            ).value,

        course_code:
            document.getElementById(
                "update_course_code"
            ).value,

        duration:
            document.getElementById(
                "update_duration"
            ).value,

        fee:
            document.getElementById(
                "update_fee"
            ).value,

        description:
            document.getElementById(
                "update_description"
            ).value
    };

    fetch("/courses/" + id, {

        method: "PUT",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(course)

    })

    .then(response => response.json())

    .then(data => {

        if (data.error) {

            alert(data.error);

        } else {

            alert(data.message);

            cancelUpdate();

            loadCourses();

        }

    })

    .catch(error => {

        console.error(error);

        alert("Unable to update course");

    });
}


/* CANCEL UPDATE */

function cancelUpdate() {

    document.getElementById(
        "updateBox"
    ).style.display = "none";

}


/* DELETE */

function deleteCourse(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this course?"
        );

    if (!confirmDelete) {
        return;
    }

    fetch("/courses/" + id, {

        method: "DELETE"

    })

    .then(response => response.json())

    .then(data => {

        if (data.error) {

            alert(data.error);

        } else {

            alert(data.message);

            loadCourses();

        }

    })

    .catch(error => {

        console.error(error);

        alert("Unable to delete course");

    });
}


/* PAGE LOAD */

loadCourses();

</script>

</body>
</html>
